[package]
name = "oc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "oc 领域层：纯策略，无 IO"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
garde = { version = "0.22", features = ["derive"] }
time = { version = "0.3", features = ["macros", "serde"] }
time-tz = "2"
serde_yaml = "0.9"
sha2 = "0.10"

[dev-dependencies]
# 仅测试用：验证 `#[serde(default)]` 在旧配置（缺 timeout_secs）下的行为。
# 不进生产依赖图，不破坏「纯策略，无 IO」。
toml = "0.8"

[features]
default = []
tiktoken = []
