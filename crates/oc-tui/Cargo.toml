[package]
name = "oc-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "oc 本地终端 UI（协议第一个 client）"

[dependencies]
oc-proto = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
# unstable-rendered-line-info：Paragraph::line_count(width) 精确算 wrap 后行数
# （含中文双宽），供消息区自动跟随底部 + 手动回滚滚动。
ratatui = { version = "0.28", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
serde_json = "1"
futures-util = "0.3"
anyhow = "1"
unicode-width = "0.1"
