[package]
name = "oc-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "oc 工具集：exec/process/file/web/... + 策略 + 审批门"

[dependencies]
oc-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
walkdir = "2"
glob = "0.3"
regex = "1"
encoding_rs = "0.8.41"

[dev-dependencies]
# test-util：审批超时用例用 `#[tokio::test(start_paused = true)]` 的虚拟时钟，
# 否则要真睡 120s / 600s。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"

[features]
default = ["web"]
# web_fetch / web_search 需要 HTTP client。
web = ["dep:reqwest"]

[target."cfg(windows)".dependencies]
winreg = "0.52"
