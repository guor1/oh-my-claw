[package]
name = "oc-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenAI Responses API compatibility layer over oc-server"

[dependencies]
oc-proto = { workspace = true }
oc-server = { workspace = true }

tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
futures-util = "0.3"
async-stream = "0.3"
dashmap = "6"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
subtle = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
# e2e 要起真 daemon（真传输 + 真 store + 脚本化模型），故开 oc-server 的测试 harness。
oc-server = { workspace = true, features = ["test-support"] }
oc-llm = { workspace = true }
oc-store = { workspace = true }
# 工具结构回归：造 ToolExecutor + ExecTool，让脚本化模型真跑一轮工具调用。
oc-tools = { workspace = true }
oc-core = { workspace = true }
# stream：cancel 用例要边读 SSE 边取 response id，不能等整条流读完。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
